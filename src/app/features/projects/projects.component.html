<section class="projects-section">
  <div class="container">

 <!-- Sección de Proyectos -->
    <div class="projects-section">
      <h2>PROYECTOS</h2>
      
      <div class="projects-grid">
        @for (project of projects; track project.id) {
          <a [href]="project.link" target="_blank" rel="noopener" class="project-card" [title]="'Ver ' + project.name + ' en GitHub'">
            <h3 class="project-title">{{ project.name }}</h3>
            <p class="project-description">{{ project.description }}</p>
            
            <div class="project-tech">
              @for (tech of project.technologies; track tech) {
                <span class="tech-badge">{{ tech }}</span>
              }
            </div>

            <span class="project-link">
              Ver en GitHub →
            </span>
          </a>
        }
      </div>
    </div>

    <div class="divider"></div>

    <h1 class="section-title">Proyectos Destacados</h1>

    <div class="projects-grid">
      <div *ngFor="let project of projects" class="project-card">
        <div class="project-header">
          <h3 class="project-title">{{ project.name }}</h3>
        </div>
        <p class="project-description">{{ project.description }}</p>
        <div class="project-technologies">
          <span *ngFor="let tech of project.technologies" class="tech-tag">
            {{ tech }}
          </span>
        </div>
      </div>
    </div>
  </div>
</section>
