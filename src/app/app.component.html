<!-- Portfolio de Eric Michel Villavicencio Reyes -->

<style>
  :host {
    --bright-blue: oklch(51.01% 0.274 263.83);
    --electric-violet: oklch(53.18% 0.28 296.97);
    --french-violet: oklch(47.66% 0.246 305.88);
    --vivid-pink: oklch(69.02% 0.277 332.77);
    --hot-red: oklch(61.42% 0.238 15.34);
    --orange-red: oklch(63.32% 0.24 31.68);

    --gray-900: oklch(19.37% 0.006 300.98);
    --gray-700: oklch(36.98% 0.014 302.71);
    --gray-400: oklch(70.9% 0.015 304.04);

    --red-to-pink-to-purple-vertical-gradient: linear-gradient(
      180deg,
      var(--orange-red) 0%,
      var(--vivid-pink) 50%,
      var(--electric-violet) 100%
    );

    --red-to-pink-to-purple-horizontal-gradient: linear-gradient(
      90deg,
      var(--orange-red) 0%,
      var(--vivid-pink) 50%,
      var(--electric-violet) 100%
    );

    --pill-accent: var(--bright-blue);

    font-family: "Press Start 2P", cursive;
    box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1 {
    font-size: 2rem;
    color: var(--hot-red);
    font-weight: 700;
    line-height: 100%;
    letter-spacing: 0.125rem;
    margin: 0;
    font-family: "Press Start 2P", cursive;
    text-shadow: 3px 3px var(--vivid-pink), 6px 6px var(--electric-violet);
  }

  h2 {
    font-size: 1.5rem;
    color: var(--vivid-pink);
    font-family: "Press Start 2P", cursive;
    text-shadow: 2px 2px var(--bright-blue);
    margin: 2rem 0 1.5rem 0;
  }

  p {
    margin: 0;
    color: var(--gray-700);
    font-size: 0.875rem;
    font-family: "Inter", sans-serif;
  }

  main {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding: 2rem 1rem;
    box-sizing: inherit;
    position: relative;
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 100%);
  }

  .container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    margin-bottom: 3rem;
    gap: 1rem;
  }

  .subtitle {
    font-size: 1rem;
    color: var(--gray-400);
    font-family: "Inter", sans-serif;
  }

  .header-buttons {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-cv {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--red-to-pink-to-purple-horizontal-gradient);
    color: white;
    padding: 0.75rem 1.5rem;
    border-radius: 0.5rem;
    text-decoration: none;
    font-family: "Press Start 2P", cursive;
    font-size: 0.75rem;
    border: 2px solid var(--vivid-pink);
    transition: all 0.3s ease;
    cursor: pointer;
    box-shadow: 0 0 10px var(--vivid-pink);
  }

  .btn-cv:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px var(--hot-red), inset 0 0 10px rgba(255, 255, 255, 0.3);
  }

  .btn-cv:active {
    transform: scale(0.95);
  }

  .projects-section {
    margin-top: 2rem;
    width: 100%;
  }

  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2rem;
    margin-top: 1.5rem;
  }

  .project-card {
    background: color-mix(in srgb, var(--bright-blue) 10%, transparent);
    border: 2px solid var(--bright-blue);
    border-radius: 0.5rem;
    padding: 1.5rem;
    transition: all 0.3s ease;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    cursor: pointer;
  }

  .project-card:hover {
    border-color: var(--vivid-pink);
    box-shadow: 0 0 20px var(--vivid-pink), inset 0 0 10px rgba(105, 2, 255, 0.2);
    transform: translateY(-5px);
    background: color-mix(in srgb, var(--vivid-pink) 15%, transparent);
  }

  .project-title {
    font-family: "Press Start 2P", cursive;
    font-size: 1rem;
    color: var(--vivid-pink);
    margin: 0;
    text-shadow: 1px 1px var(--bright-blue);
  }

  .project-description {
    font-family: "Inter", sans-serif;
    font-size: 0.875rem;
    color: var(--gray-700);
    flex-grow: 1;
  }

  .project-tech {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  .tech-badge {
    background: color-mix(in srgb, var(--bright-blue) 20%, transparent);
    color: var(--bright-blue);
    padding: 0.25rem 0.75rem;
    border-radius: 2rem;
    font-size: 0.7rem;
    font-family: "Inter", sans-serif;
    border: 1px solid var(--bright-blue);
  }

  .project-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    color: var(--electric-violet);
    text-decoration: none;
    font-family: "Inter", sans-serif;
    font-size: 0.875rem;
    font-weight: 600;
    transition: all 0.3s ease;
  }

  .project-link:hover {
    color: var(--vivid-pink);
    text-decoration: underline;
  }

  .social-links {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin-top: 2rem;
    justify-content: center;
  }

  .social-links a {
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .social-links svg {
    width: 32px;
    height: 32px;
  }

  .social-links path {
    transition: fill 0.3s ease;
    fill: var(--vivid-pink);
  }

  .social-links a:hover svg path {
    fill: var(--hot-red);
    filter: drop-shadow(0 0 5px var(--hot-red));
  }

  .divider {
    width: 100%;
    height: 2px;
    background: var(--red-to-pink-to-purple-horizontal-gradient);
    margin: 3rem 0;
    box-shadow: 0 0 10px rgba(105, 2, 255, 0.5);
  }

  @media screen and (max-width: 768px) {
    h1 {
      font-size: 1.5rem;
    }

    h2 {
      font-size: 1.25rem;
    }

    .projects-grid {
      grid-template-columns: 1fr;
    }

    .header-buttons {
      flex-direction: column;
      width: 100%;
    }

    .btn-cv {
      width: 100%;
      justify-content: center;
    }

    .subtitle {
      font-size: 0.875rem;
    }
  }
</style>

<main class="main">
  <div class="container">
    <!-- Header con botón de CV -->
    <div class="header">
      <h1>{{ title }}</h1>
      <p class="subtitle">Ingeniero Informático | Full Stack Developer | Profesor Universitario</p>
      <div class="header-buttons">
        <a href="/assets/cv.pdf" download class="btn-cv">
          📥 DESCARGAR CV
        </a>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Sección de Proyectos -->
    <div class="projects-section">
      <h2>PROYECTOS</h2>
      
      <div class="projects-grid">
        @for (project of projects; track project.id) {
          <a [href]="project.github" target="_blank" rel="noopener" class="project-card" [title]="'Ver ' + project.title + ' en GitHub'">
            <h3 class="project-title">{{ project.title }}</h3>
            <p class="project-description">{{ project.description }}</p>
            
            <div class="project-tech">
              @for (tech of project.technologies; track tech) {
                <span class="tech-badge">{{ tech }}</span>
              }
            </div>

            <span class="project-link">
              Ver en GitHub →
            </span>
          </a>
        }
      </div>
    </div>

    <div class="divider"></div>

    <!-- Enlaces Sociales -->
    <div class="social-links">
      <a
        href="https://github.com/ElectroZombie"
        aria-label="GitHub - ElectroZombie"
        target="_blank"
        rel="noopener"
        title="GitHub"
      >
        <svg
          viewBox="0 0 25 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          alt="Github"
        >
          <path
            d="M12.3047 0C5.50634 0 0 5.50942 0 12.3047C0 17.7423 3.52529 22.3535 8.41332 23.9787C9.02856 24.0946 9.25414 23.7142 9.25414 23.3871C9.25414 23.0949 9.24389 22.3207 9.23876 21.2953C5.81518 22.0451 5.08873 19.8376 5.08873 19.8376C4.53446 18.3745 3.71518 18.0089 3.71518 18.0089C2.56781 17.2643 3.80255 17.2821 3.80255 17.2821C5.07477 17.3741 5.74257 18.533 5.74257 18.533C6.86488 20.4493 8.77315 19.8994 9.27881 19.5852C9.3817 18.8156 9.66881 18.2769 9.98761 17.9386C7.27541 17.5937 4.41088 16.5193 4.41088 11.8103C4.41088 10.4334 4.87767 9.32221 5.76596 8.44996C5.64749 8.10624 5.23542 6.81962 5.87621 5.09094C5.87621 5.09094 6.94378 4.75832 9.2211 6.33389C10.2172 6.04577 11.2761 5.8984 12.326 5.89386C13.376 5.8984 14.4359 6.04577 15.433 6.33389C17.7092 4.75832 18.7744 5.09094 18.7744 5.09094C19.4176 6.81962 19.0036 8.10624 18.8875 8.44996C19.7788 9.32221 20.2395 10.4334 20.2395 11.8103C20.2395 16.5338 17.3696 17.5885 14.6447 17.9244C15.0495 18.3276 15.4127 19.1202 15.4127 20.337C15.4127 22.0763 15.3999 23.4812 15.3999 23.3871C15.3999 23.7142 15.6221 24.0995 16.2475 23.9787C21.1304 22.348 24.6527 17.7371 24.6527 12.3047C24.6527 5.50942 19.1436 0 12.3047 0Z"
            fill="currentColor"
          />
        </svg>
      </a>
      <a
        href="mailto:eric.villavicencio@example.com"
        aria-label="Email"
        title="Enviar email"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"
            fill="currentColor"
          />
        </svg>
      </a>
      <a
        href="https://linkedin.com/in/eric-michel"
        aria-label="LinkedIn"
        target="_blank"
        rel="noopener"
        title="LinkedIn"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M20.447 20.452h-3.554v-5.569c0-1.328-.475-2.236-1.986-2.236-1.081 0-1.722.722-2.004 1.418-.103.249-.129.597-.129.946v5.441h-3.554s.05-8.807 0-9.726h3.554v1.375c.427-.659 1.191-1.595 2.897-1.595 2.117 0 3.704 1.385 3.704 4.362v5.584zM5.337 8.855c-1.144 0-1.915-.759-1.915-1.71 0-.954.77-1.71 1.954-1.71 1.184 0 1.915.756 1.938 1.71 0 .951-.754 1.71-1.977 1.71zm1.581 11.597H3.586V9.581h3.332v10.871zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"
            fill="currentColor"
          />
        </svg>
      </a>
    </div>
  </div>
</main>

<router-outlet />
